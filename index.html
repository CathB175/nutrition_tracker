<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nutrition Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Courier New', monospace;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #f0f0f0;
      min-height: 100vh;
    }

    /* ── LOGIN ── */
    #login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .login-box {
      background: #2a3346;
      border: 2px solid #00ff88;
      padding: 50px 40px;
      width: 100%;
      max-width: 420px;
    }
    .login-box h1 {
      font-size: 42px;
      font-weight: bold;
      letter-spacing: -2px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #00ff88 0%, #66ff99 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
      line-height: 1;
    }
    .login-box p {
      color: #999;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 35px;
    }
    .login-box input {
      width: 100%;
      padding: 14px 16px;
      background: #252b3b;
      border: 2px solid #3d4a5c;
      color: #f0f0f0;
      font-size: 14px;
      font-family: 'Courier New', monospace;
      outline: none;
      margin-bottom: 15px;
      transition: border-color 0.2s;
    }
    .login-box input:focus { border-color: #00ff88; }
    .login-btn {
      width: 100%;
      padding: 14px;
      background: #00ff88;
      color: #000;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-family: 'Courier New', monospace;
      transition: background 0.2s;
    }
    .login-btn:hover { background: #33ffaa; }
    .login-btn:disabled { background: #3d4a5c; color: #666; cursor: not-allowed; }
    .login-error {
      color: #ff5252;
      font-size: 12px;
      margin-top: 12px;
      display: none;
    }

    /* ── APP ── */
    #app-screen { display: none; }

    .bg-blob1 {
      position: fixed; top: 10%; right: 5%;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(100,255,100,0.25) 0%, transparent 70%);
      border-radius: 50%; filter: blur(60px); pointer-events: none; z-index: 0;
    }
    .bg-blob2 {
      position: fixed; bottom: 20%; left: 10%;
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(255,180,50,0.2) 0%, transparent 70%);
      border-radius: 50%; filter: blur(50px); pointer-events: none; z-index: 0;
    }

    .app-inner {
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 20px;
      position: relative;
      z-index: 1;
    }

    /* Header */
    header {
      margin-bottom: 50px;
      border-bottom: 3px solid #00ff88;
      padding-bottom: 25px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 20px;
    }
    header h1 {
      font-size: clamp(42px, 6vw, 72px);
      font-weight: bold;
      letter-spacing: -3px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #00ff88 0%, #66ff99 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }
    header .subtitle {
      font-size: 14px;
      color: #999;
      margin-top: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .header-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

    /* Buttons */
    .btn {
      padding: 12px 20px;
      border: none;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-family: 'Courier New', monospace;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .btn-green { background: #00ff88; color: #000; }
    .btn-green:hover { background: #33ffaa; }
    .btn-amber { background: #ffaa00; color: #000; }
    .btn-amber:hover { background: #ffcc33; }
    .btn-red { background: #ff5252; color: #000; }
    .btn-red:hover { background: #ff7070; }
    .btn-gray { background: #3d4a5c; color: #f0f0f0; }
    .btn-gray:hover { background: #4d5a6c; }
    .btn-muted { background: #3d4a5c; color: #999; font-size: 11px; }
    .btn:disabled { background: #3d4a5c !important; color: #666 !important; cursor: not-allowed; }

    /* Stats badge */
    .stats-badge {
      padding: 12px 20px;
      background: #3d4a5c;
      color: #999;
      font-size: 11px;
      font-family: 'Courier New', monospace;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Tabs */
    .tabs {
      display: flex;
      border: 2px solid #3d4a5c;
      background: #252b3b;
      overflow: hidden;
      margin-bottom: 45px;
    }
    .tab-btn {
      flex: 1;
      padding: 18px 30px;
      background: transparent;
      color: #999;
      border: none;
      border-right: 1px solid #3d4a5c;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-family: 'Courier New', monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
    }
    .tab-btn.active { background: #00ff88; color: #000; }
    .tab-btn:last-child { border-right: none; }

    /* Section header row */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      gap: 15px;
      flex-wrap: wrap;
    }
    .section-header h2 {
      font-size: clamp(24px, 4vw, 36px);
      font-weight: bold;
      letter-spacing: -1px;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .search-row {
      display: flex;
      gap: 10px;
      flex: 1;
      max-width: 600px;
    }

    /* Inputs */
    input[type=text], input[type=email], input[type=password],
    input[type=number], textarea, select {
      padding: 14px 16px;
      background: #252b3b;
      border: 2px solid #3d4a5c;
      color: #f0f0f0;
      font-size: 14px;
      font-family: 'Courier New', monospace;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, textarea:focus, select:focus { border-color: #00ff88; }
    .recipe-tab input:focus, .recipe-tab textarea:focus, .recipe-tab select:focus { border-color: #ffaa00; }

    input.search-input {
      flex: 1;
      min-width: 0;
    }
    select.sort-select {
      padding: 14px 12px;
      cursor: pointer;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-size: 12px;
    }

    /* Form panels */
    .form-panel {
      padding: 30px;
      margin-bottom: 35px;
      animation: slideDown 0.25s ease;
    }
    .form-panel.green { background: #2a3346; border: 2px solid #00ff88; }
    .form-panel.amber { background: #2a3346; border: 2px solid #ffaa00; }
    .form-panel h3 {
      font-size: 22px;
      margin-bottom: 22px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .form-panel.green h3 { color: #00ff88; }
    .form-panel.amber h3 { color: #ffaa00; }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 18px;
    }
    .form-group label {
      display: block;
      font-size: 11px;
      color: #00ff88;
      margin-bottom: 7px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: bold;
    }
    .form-group.amber label { color: #ffaa00; }
    .form-group input, .form-group select { width: 100%; }
    .serving-row { display: flex; gap: 10px; }
    .serving-row input { flex: 1; }

    .form-actions { display: flex; gap: 12px; margin-top: 22px; }
    .form-actions .btn { flex: 1; padding: 14px; font-size: 14px; }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Empty states */
    .empty-state {
      text-align: center;
      padding: 70px 20px;
      color: #666;
    }
    .empty-state svg { margin-bottom: 22px; opacity: 0.4; }
    .empty-state .big { font-size: 22px; color: #999; margin-bottom: 8px; }
    .empty-state .small { font-size: 14px; color: #666; }

    /* Results label */
    .results-label {
      font-size: 13px;
      color: #999;
      margin-bottom: 18px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Food card */
    .food-card {
      background: #2a3346;
      border: 2px solid #3d4a5c;
      padding: 22px;
      margin-bottom: 16px;
      transition: border-color 0.2s, transform 0.2s;
    }
    .food-card:hover { border-color: #00ff88; transform: translateX(5px); }
    .food-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
      gap: 12px;
    }
    .food-card-header h3 {
      font-size: 22px;
      font-weight: bold;
      margin: 0 0 5px;
      color: #00ff88;
      text-transform: uppercase;
    }
    .food-card-header .serving { color: #999; font-size: 13px; }
    .food-card-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
    .cal-badge {
      background: #00ff88;
      color: #000;
      padding: 7px 14px;
      font-weight: bold;
      font-size: 17px;
      white-space: nowrap;
    }
    .cal-badge.amber { background: #ffaa00; }

    .nutrient-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
      gap: 12px;
      padding-top: 14px;
      border-top: 1px solid #3d4a5c;
    }
    .nutrient-item .label { font-size: 10px; color: #666; text-transform: uppercase; letter-spacing: 1px; }
    .nutrient-item .value { font-size: 17px; font-weight: bold; color: #f0f0f0; margin-top: 3px; }

    /* Recipe card */
    .recipe-card {
      background: #2a3346;
      border: 2px solid #3d4a5c;
      padding: 26px;
      margin-bottom: 20px;
      transition: border-color 0.2s, transform 0.2s;
    }
    .recipe-card:hover { border-color: #ffaa00; transform: translateX(5px); }
    .recipe-card.list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      padding: 18px 22px;
    }
    .recipe-card.list-item h3 {
      font-size: 18px;
      font-weight: bold;
      margin: 0 0 4px;
      color: #ffaa00;
      text-transform: uppercase;
    }
    .recipe-card.list-item .meta { color: #999; font-size: 13px; }

    .nutrition-panel {
      background: #252b3b;
      border: 2px solid #ffaa00;
      padding: 18px;
      margin-bottom: 18px;
    }
    .nutrition-panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .nutrition-panel-header h4 {
      font-size: 13px;
      color: #ffaa00;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Ingredient dropdown */
    .ingredient-search-wrap { position: relative; flex: 1; }
    .ingredient-dropdown {
      position: absolute;
      top: 100%;
      left: 0; right: 0;
      background: #252b3b;
      border: 2px solid #ffaa00;
      border-top: none;
      max-height: 280px;
      overflow-y: auto;
      z-index: 1000;
      display: none;
    }
    .ingredient-dropdown.open { display: block; }
    .dropdown-item {
      padding: 13px 15px;
      border-bottom: 1px solid #3d4a5c;
      cursor: pointer;
      transition: background 0.15s;
    }
    .dropdown-item:hover { background: #2a3346; }
    .dropdown-item .di-name { font-size: 15px; font-weight: bold; color: #ffaa00; }
    .dropdown-item .di-cal { font-size: 13px; color: #00ff88; font-weight: bold; }
    .dropdown-item .di-meta { font-size: 12px; color: #999; margin: 4px 0; }
    .dropdown-item .di-macros { font-size: 11px; color: #666; display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; }

    .selected-food-hint {
      margin-top: 8px;
      padding: 10px 14px;
      background: #2a3346;
      border: 1px solid #ffaa00;
      font-size: 12px;
      color: #999;
    }
    .selected-food-hint strong { color: #ffaa00; }

    .ingredient-add-row { display: flex; gap: 10px; align-items: flex-start; }
    .qty-input { width: 130px; }

    .ingredients-list {
      background: #252b3b;
      border: 2px solid #3d4a5c;
      padding: 18px;
      margin-bottom: 18px;
    }
    .ingredients-list h5 {
      font-size: 13px;
      margin-bottom: 12px;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .ingredient-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #3d4a5c;
      font-size: 14px;
    }
    .ingredient-row:last-child { border-bottom: none; }

    .ingredients-display { display: flex; flex-direction: column; gap: 7px; }
    .ingredient-display-item {
      padding: 9px 14px;
      background: #252b3b;
      border: 1px solid #3d4a5c;
      color: #f0f0f0;
      font-size: 14px;
    }

    /* Loading */
    #loading-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-size: 18px;
      color: #00ff88;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

<!-- Loading -->
<div id="loading-screen">Loading...</div>

<!-- Login -->
<div id="login-screen" style="display:none">
  <div class="login-box">
    <h1>Nutrition</h1>
    <p>Database &amp; Recipe Calculator</p>
    <input type="email" id="login-email" placeholder="Email" autocomplete="email" />
    <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" />
    <button class="login-btn" id="login-btn" onclick="handleLogin()">Login</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- App -->
<div id="app-screen" style="display:none">
  <div class="bg-blob1"></div>
  <div class="bg-blob2"></div>
  <div class="app-inner">

    <!-- Header -->
    <header>
      <div>
        <h1>Nutrition</h1>
        <div class="subtitle">Database &amp; Recipe Calculator</div>
      </div>
      <div class="header-actions">
        <button class="btn btn-green" onclick="exportData()">
          <i data-lucide="download" style="width:16px;height:16px"></i> Export
        </button>
        <label class="btn btn-amber" style="cursor:pointer">
          <i data-lucide="upload" style="width:16px;height:16px"></i> Import
          <input type="file" accept=".json" onchange="importData(event)" style="display:none" />
        </label>
        <div class="stats-badge" id="stats-badge">0 Foods | 0 Recipes</div>
        <button class="btn btn-gray" onclick="handleLogout()" style="font-size:11px">
          <i data-lucide="log-out" style="width:14px;height:14px"></i> Logout
        </button>
      </div>
    </header>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" id="tab-foods" onclick="switchTab('foods')">
        <i data-lucide="apple" style="width:18px;height:18px"></i> Foods Database
      </button>
      <button class="tab-btn" id="tab-recipes" onclick="switchTab('recipes')">
        <i data-lucide="chef-hat" style="width:18px;height:18px"></i> Recipe Builder
      </button>
    </div>

    <!-- FOODS TAB -->
    <div id="foods-tab">
      <div class="section-header">
        <h2>Food Items</h2>
        <div class="search-row">
          <input type="text" class="search-input" placeholder="Search foods..." id="food-search" oninput="renderFoods()" />
          <select class="sort-select" id="food-sort" onchange="renderFoods()">
            <option value="name">Sort: A-Z</option>
            <option value="calories">Sort: Calories</option>
          </select>
        </div>
        <button class="btn btn-green" id="add-food-btn" onclick="toggleFoodForm()">
          <i data-lucide="plus" style="width:16px;height:16px"></i> Add Food
        </button>
      </div>

      <!-- Food form -->
      <div id="food-form" class="form-panel green" style="display:none">
        <h3 id="food-form-title">New Food Item</h3>
        <div class="form-grid">
          <div class="form-group">
            <label>Food Name</label>
            <input type="text" id="ff-name" placeholder="Food Name" />
          </div>
          <div class="form-group">
            <label>Serving Size</label>
            <div class="serving-row">
              <input type="number" id="ff-serving-size" placeholder="100" />
              <select id="ff-serving-unit">
                <option>g</option><option>ml</option><option>oz</option>
                <option>lb</option><option>cup</option><option>tbsp</option>
                <option>tsp</option><option>item</option><option>slice</option><option>piece</option>
              </select>
            </div>
          </div>
          <div class="form-group"><label>Calories</label><input type="number" step="0.1" id="ff-calories" placeholder="0" /></div>
          <div class="form-group"><label>Protein</label><input type="number" step="0.1" id="ff-protein" placeholder="0" /></div>
          <div class="form-group"><label>Carbohydrates</label><input type="number" step="0.1" id="ff-carbohydrates" placeholder="0" /></div>
          <div class="form-group"><label>Fat</label><input type="number" step="0.1" id="ff-fat" placeholder="0" /></div>
          <div class="form-group"><label>Fiber</label><input type="number" step="0.1" id="ff-fiber" placeholder="0" /></div>
          <div class="form-group"><label>Sugar</label><input type="number" step="0.1" id="ff-sugar" placeholder="0" /></div>
          <div class="form-group"><label>Sodium</label><input type="number" step="0.1" id="ff-sodium" placeholder="0" /></div>
        </div>
        <div class="form-actions">
          <button class="btn btn-green" id="food-save-btn" onclick="saveFood()">Save Food</button>
          <button class="btn btn-gray" id="food-cancel-btn" onclick="cancelFoodForm()" style="display:none">Cancel</button>
        </div>
      </div>

      <div id="foods-list"></div>
    </div>

    <!-- RECIPES TAB -->
    <div id="recipes-tab" class="recipe-tab" style="display:none">
      <div class="section-header">
        <h2>Recipes</h2>
        <div class="search-row">
          <input type="text" class="search-input" placeholder="Search recipes..." id="recipe-search" oninput="renderRecipes()" />
          <select class="sort-select" id="recipe-sort" onchange="renderRecipes()">
            <option value="name">Sort: A-Z</option>
            <option value="calories">Sort: Calories</option>
          </select>
        </div>
        <button class="btn btn-amber" id="add-recipe-btn" onclick="toggleRecipeForm()">
          <i data-lucide="plus" style="width:16px;height:16px"></i> New Recipe
        </button>
      </div>

      <!-- Recipe form -->
      <div id="recipe-form" class="form-panel amber" style="display:none">
        <h3 id="recipe-form-title">Create Recipe</h3>
        <input type="text" id="rf-name" placeholder="Recipe Name" style="width:100%;margin-bottom:12px" />
        <textarea id="rf-description" placeholder="Description (optional)" style="width:100%;min-height:70px;resize:vertical;margin-bottom:12px"></textarea>
        <input type="number" id="rf-servings" placeholder="Total Servings" value="1" style="width:100%;margin-bottom:22px" />

        <h4 style="font-size:16px;margin-bottom:12px;color:#ffaa00;text-transform:uppercase;letter-spacing:1px">Add Ingredients</h4>
        <div style="margin-bottom:18px">
          <div class="ingredient-add-row">
            <div class="ingredient-search-wrap">
              <input type="text" id="ing-search" placeholder="Search for food..." style="width:100%"
                oninput="filterIngredients()"
                onfocus="openDropdown()"
                onblur="scheduleCloseDropdown()" />
              <div class="ingredient-dropdown" id="ing-dropdown"></div>
            </div>
            <input type="number" step="0.1" class="qty-input" id="ing-qty" placeholder="Quantity" />
            <button class="btn btn-amber" id="ing-add-btn" onclick="addIngredient()" disabled>
              <i data-lucide="plus" style="width:16px;height:16px"></i>
            </button>
          </div>
          <div id="selected-food-hint" style="display:none" class="selected-food-hint"></div>
        </div>

        <div id="recipe-ingredients-list" style="display:none" class="ingredients-list">
          <h5>Ingredients (<span id="ing-count">0</span>)</h5>
          <div id="recipe-ingredients-items"></div>
        </div>

        <button class="btn btn-amber" id="recipe-save-btn" onclick="saveRecipe()" style="width:100%;padding:14px;font-size:14px;margin-bottom:8px" disabled>
          Save Recipe
        </button>
        <button class="btn btn-gray" id="recipe-cancel-btn" onclick="cancelRecipeForm()" style="width:100%;padding:14px;font-size:14px;display:none">
          Cancel Edit
        </button>
      </div>

      <div id="recipes-list"></div>
    </div>

  </div>
</div>

<script>
// ─────────────────────────────────────────────
// CONFIG — replace with your actual values
// ─────────────────────────────────────────────
const SUPABASE_URL  = 'https://hebuaabantmnfdxxkaif.supabase.co';
const SUPABASE_ANON = 'sb_publishable_xzVfo0l-eLpkP4TuUy17KQ_kLLUUScF';

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON);

// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
let foods = [];
let recipes = [];
let editingFood = null;
let editingRecipe = null;
let selectedIngredient = null;
let currentIngredients = []; // ingredients being built in recipe form
let activeTab = 'foods';

// ─────────────────────────────────────────────
// AUTH
// ─────────────────────────────────────────────
async function init() {
  const { data: { session } } = await db.auth.getSession();
  if (session) {
    showApp();
  } else {
    showLogin();
  }

  db.auth.onAuthStateChange((_event, session) => {
    if (session) showApp();
    else showLogin();
  });
}

function showLogin() {
  document.getElementById('loading-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('app-screen').style.display = 'none';
}

async function showApp() {
  document.getElementById('loading-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'block';
  lucide.createIcons();
  await loadFoods();
  await loadRecipes();
}

async function handleLogin() {
  const email    = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const btn      = document.getElementById('login-btn');
  const errEl    = document.getElementById('login-error');

  errEl.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Logging in...';

  const { error } = await db.auth.signInWithPassword({ email, password });

  if (error) {
    errEl.textContent = error.message;
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Login';
  }
}

async function handleLogout() {
  await db.auth.signOut();
}

// Allow Enter key on login
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && document.getElementById('login-screen').style.display !== 'none') {
    handleLogin();
  }
});

// ─────────────────────────────────────────────
// DATA LOADING
// ─────────────────────────────────────────────
async function loadFoods() {
  const { data, error } = await db.from('foods').select('*').order('name');
  if (!error) {
    foods = data || [];
    renderFoods();
    updateStats();
  }
}

async function loadRecipes() {
  const { data, error } = await db.from('recipes').select(`
    *, recipe_ingredients ( quantity, unit, foods(*) )
  `).order('name');

  if (!error) {
    recipes = (data || []).map(r => ({
      ...r,
      ingredients: r.recipe_ingredients.map(ri => ({
        food: ri.foods,
        quantity: ri.quantity,
        unit: ri.unit
      }))
    }));
    renderRecipes();
    updateStats();
  }
}

function updateStats() {
  document.getElementById('stats-badge').textContent =
    `${foods.length} Foods | ${recipes.length} Recipes`;
}

// ─────────────────────────────────────────────
// TABS
// ─────────────────────────────────────────────
function switchTab(tab) {
  activeTab = tab;
  document.getElementById('foods-tab').style.display    = tab === 'foods'   ? 'block' : 'none';
  document.getElementById('recipes-tab').style.display  = tab === 'recipes' ? 'block' : 'none';
  document.getElementById('tab-foods').classList.toggle('active',   tab === 'foods');
  document.getElementById('tab-recipes').classList.toggle('active', tab === 'recipes');
}

// ─────────────────────────────────────────────
// FOOD FORM
// ─────────────────────────────────────────────
function toggleFoodForm() {
  const form = document.getElementById('food-form');
  if (form.style.display === 'none') {
    editingFood = null;
    clearFoodForm();
    document.getElementById('food-form-title').textContent = 'New Food Item';
    document.getElementById('food-save-btn').textContent = 'Save Food';
    document.getElementById('food-cancel-btn').style.display = 'none';
    document.getElementById('add-food-btn').innerHTML = '<i data-lucide="x" style="width:16px;height:16px"></i> Cancel';
    document.getElementById('add-food-btn').className = 'btn btn-red';
    form.style.display = 'block';
    lucide.createIcons();
  } else {
    cancelFoodForm();
  }
}

function cancelFoodForm() {
  editingFood = null;
  clearFoodForm();
  document.getElementById('food-form').style.display = 'none';
  document.getElementById('add-food-btn').innerHTML = '<i data-lucide="plus" style="width:16px;height:16px"></i> Add Food';
  document.getElementById('add-food-btn').className = 'btn btn-green';
  lucide.createIcons();
}

function clearFoodForm() {
  ['ff-name','ff-serving-size','ff-calories','ff-protein',
   'ff-carbohydrates','ff-fat','ff-fiber','ff-sugar','ff-sodium']
    .forEach(id => document.getElementById(id).value = '');
  document.getElementById('ff-serving-unit').value = 'g';
}

function startEditFood(food) {
  editingFood = food;
  document.getElementById('ff-name').value          = food.name;
  document.getElementById('ff-serving-size').value  = food.serving_size;
  document.getElementById('ff-serving-unit').value  = food.serving_unit;
  document.getElementById('ff-calories').value      = food.calories;
  document.getElementById('ff-protein').value       = food.protein;
  document.getElementById('ff-carbohydrates').value = food.carbohydrates;
  document.getElementById('ff-fat').value           = food.fat;
  document.getElementById('ff-fiber').value         = food.fiber;
  document.getElementById('ff-sugar').value         = food.sugar;
  document.getElementById('ff-sodium').value        = food.sodium;

  document.getElementById('food-form-title').textContent = 'Edit Food Item';
  document.getElementById('food-save-btn').textContent   = 'Update Food';
  document.getElementById('food-cancel-btn').style.display = 'inline-flex';
  document.getElementById('add-food-btn').innerHTML = '<i data-lucide="x" style="width:16px;height:16px"></i> Cancel';
  document.getElementById('add-food-btn').className = 'btn btn-red';
  document.getElementById('food-form').style.display = 'block';
  lucide.createIcons();
  document.getElementById('food-form').scrollIntoView({ behavior: 'smooth' });
}

async function saveFood() {
  const name        = document.getElementById('ff-name').value.trim();
  const servingSize = parseFloat(document.getElementById('ff-serving-size').value);
  if (!name || !servingSize || servingSize <= 0) return alert('Name and serving size are required.');

  const food = {
    name,
    serving_size:    servingSize,
    serving_unit:    document.getElementById('ff-serving-unit').value,
    calories:        Math.max(0, parseFloat(document.getElementById('ff-calories').value)      || 0),
    protein:         Math.max(0, parseFloat(document.getElementById('ff-protein').value)       || 0),
    carbohydrates:   Math.max(0, parseFloat(document.getElementById('ff-carbohydrates').value) || 0),
    fat:             Math.max(0, parseFloat(document.getElementById('ff-fat').value)           || 0),
    fiber:           Math.max(0, parseFloat(document.getElementById('ff-fiber').value)         || 0),
    sugar:           Math.max(0, parseFloat(document.getElementById('ff-sugar').value)         || 0),
    sodium:          Math.max(0, parseFloat(document.getElementById('ff-sodium').value)        || 0),
  };

  if (editingFood) {
    const { data, error } = await db.from('foods').update(food).eq('id', editingFood.id).select();
    if (error) return alert('Error: ' + error.message);
    foods = foods.map(f => f.id === editingFood.id ? data[0] : f);
  } else {
    const { data, error } = await db.from('foods').insert([food]).select();
    if (error) return alert('Error: ' + error.message);
    foods.push(data[0]);
  }

  cancelFoodForm();
  renderFoods();
  updateStats();
}

async function deleteFood(id) {
  if (!confirm('Delete this food?')) return;
  const { error } = await db.from('foods').delete().eq('id', id);
  if (error) return alert('Error: ' + error.message);
  foods = foods.filter(f => f.id !== id);
  renderFoods();
  updateStats();
}

// ─────────────────────────────────────────────
// RENDER FOODS
// ─────────────────────────────────────────────
function renderFoods() {
  const query  = document.getElementById('food-search').value.toLowerCase().trim();
  const sortBy = document.getElementById('food-sort').value;
  const el     = document.getElementById('foods-list');

  if (!query) {
    el.innerHTML = `<div class="empty-state">
      <svg xmlns="http://www.w3.org/2000/svg" width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z"/><path d="M12 8v4l3 3"/></svg>
      <div class="big">${foods.length} food${foods.length !== 1 ? 's' : ''} in database</div>
      <div class="small">Use the search bar above to find foods</div>
    </div>`;
    return;
  }

  let filtered = foods.filter(f => f.name.toLowerCase().includes(query));

  filtered.sort((a, b) => sortBy === 'calories'
    ? b.calories - a.calories
    : a.name.localeCompare(b.name));

  if (!filtered.length) {
    el.innerHTML = `<div class="empty-state">
      <div class="big">No foods found matching "${query}"</div>
      <div class="small">Try a different search term</div>
    </div>`;
    return;
  }

  el.innerHTML = `<div class="results-label">Showing ${filtered.length} result${filtered.length !== 1 ? 's' : ''}</div>`
    + filtered.map(f => `
    <div class="food-card">
      <div class="food-card-header">
        <div>
          <h3>${esc(f.name)}</h3>
          <div class="serving">Per ${f.serving_size}${esc(f.serving_unit)}</div>
        </div>
        <div class="food-card-actions">
          <div class="cal-badge">${f.calories} CAL</div>
          <button class="btn btn-amber" style="padding:8px 11px" onclick="startEditFood(${f.id})">
            <i data-lucide="edit-2" style="width:14px;height:14px"></i>
          </button>
          <button class="btn btn-red" style="padding:8px 11px" onclick="deleteFood(${f.id})">
            <i data-lucide="trash-2" style="width:14px;height:14px"></i>
          </button>
        </div>
      </div>
      <div class="nutrient-grid">
        ${[['Protein',f.protein,'g'],['Carbs',f.carbohydrates,'g'],['Fat',f.fat,'g'],
           ['Fiber',f.fiber,'g'],['Sugar',f.sugar,'g'],['Sodium',f.sodium,'mg']]
          .map(([l,v,u]) => `<div class="nutrient-item"><div class="label">${l}</div><div class="value">${v}${u}</div></div>`).join('')}
      </div>
    </div>`).join('');

  lucide.createIcons();
}

// ─────────────────────────────────────────────
// RECIPE FORM
// ─────────────────────────────────────────────
function toggleRecipeForm() {
  const form = document.getElementById('recipe-form');
  if (form.style.display === 'none') {
    editingRecipe = null;
    clearRecipeForm();
    document.getElementById('recipe-form-title').textContent = 'Create Recipe';
    document.getElementById('recipe-save-btn').textContent   = 'Save Recipe';
    document.getElementById('recipe-cancel-btn').style.display = 'none';
    document.getElementById('add-recipe-btn').innerHTML = '<i data-lucide="x" style="width:16px;height:16px"></i> Cancel';
    document.getElementById('add-recipe-btn').className = 'btn btn-red';
    form.style.display = 'block';
    lucide.createIcons();
  } else {
    cancelRecipeForm();
  }
}

function cancelRecipeForm() {
  editingRecipe = null;
  clearRecipeForm();
  document.getElementById('recipe-form').style.display = 'none';
  document.getElementById('add-recipe-btn').innerHTML = '<i data-lucide="plus" style="width:16px;height:16px"></i> New Recipe';
  document.getElementById('add-recipe-btn').className = 'btn btn-amber';
  lucide.createIcons();
}

function clearRecipeForm() {
  document.getElementById('rf-name').value        = '';
  document.getElementById('rf-description').value = '';
  document.getElementById('rf-servings').value    = '1';
  document.getElementById('ing-search').value     = '';
  document.getElementById('ing-qty').value        = '';
  currentIngredients = [];
  selectedIngredient = null;
  document.getElementById('selected-food-hint').style.display = 'none';
  document.getElementById('ing-add-btn').disabled = true;
  updateIngredientsList();
  updateRecipeSaveBtn();
}

function startEditRecipe(recipe) {
  editingRecipe = recipe;
  document.getElementById('rf-name').value        = recipe.name;
  document.getElementById('rf-description').value = recipe.description || '';
  document.getElementById('rf-servings').value    = recipe.total_servings;
  currentIngredients = [...recipe.ingredients];

  document.getElementById('recipe-form-title').textContent   = 'Edit Recipe';
  document.getElementById('recipe-save-btn').textContent     = 'Update Recipe';
  document.getElementById('recipe-cancel-btn').style.display = 'inline-flex';
  document.getElementById('add-recipe-btn').innerHTML = '<i data-lucide="x" style="width:16px;height:16px"></i> Cancel';
  document.getElementById('add-recipe-btn').className = 'btn btn-red';
  document.getElementById('recipe-form').style.display = 'block';
  lucide.createIcons();
  updateIngredientsList();
  updateRecipeSaveBtn();
  document.getElementById('recipe-form').scrollIntoView({ behavior: 'smooth' });
}

// Ingredient search dropdown
function filterIngredients() {
  const q = document.getElementById('ing-search').value.toLowerCase().trim();
  selectedIngredient = null;
  document.getElementById('selected-food-hint').style.display = 'none';
  document.getElementById('ing-add-btn').disabled = true;
  openDropdown();
}

function openDropdown() {
  const q = document.getElementById('ing-search').value.toLowerCase().trim();
  const dd = document.getElementById('ing-dropdown');
  if (!q) { dd.classList.remove('open'); return; }

  const matches = foods.filter(f => f.name.toLowerCase().includes(q)).slice(0, 20);
  if (!matches.length) { dd.classList.remove('open'); return; }

  dd.innerHTML = matches.map(f => `
    <div class="dropdown-item" onmousedown="selectIngredient(${f.id})">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:5px">
        <div class="di-name">${esc(f.name)}</div>
        <div class="di-cal">${f.calories} cal</div>
      </div>
      <div class="di-meta">Per ${f.serving_size}${esc(f.serving_unit)}</div>
      <div class="di-macros"><span>P: ${f.protein}g</span><span>C: ${f.carbohydrates}g</span><span>F: ${f.fat}g</span></div>
    </div>`).join('');
  dd.classList.add('open');
}

function selectIngredient(id) {
  selectedIngredient = foods.find(f => f.id === id);
  if (!selectedIngredient) return;
  document.getElementById('ing-search').value = selectedIngredient.name;
  document.getElementById('ing-dropdown').classList.remove('open');
  const hint = document.getElementById('selected-food-hint');
  hint.innerHTML = `Selected: <strong>${esc(selectedIngredient.name)}</strong> (${selectedIngredient.serving_size}${esc(selectedIngredient.serving_unit)} = ${selectedIngredient.calories} cal)`;
  hint.style.display = 'block';
  updateAddIngBtn();
}

let closeTimer;
function scheduleCloseDropdown() {
  closeTimer = setTimeout(() => document.getElementById('ing-dropdown').classList.remove('open'), 200);
}

document.getElementById('ing-qty').addEventListener('input', updateAddIngBtn);

function updateAddIngBtn() {
  const qty = parseFloat(document.getElementById('ing-qty').value);
  document.getElementById('ing-add-btn').disabled = !(selectedIngredient && qty > 0);
}

function addIngredient() {
  if (!selectedIngredient) return;
  const qty = parseFloat(document.getElementById('ing-qty').value);
  if (!qty || qty <= 0) return;

  currentIngredients.push({
    food: selectedIngredient,
    quantity: qty,
    unit: selectedIngredient.serving_unit
  });

  selectedIngredient = null;
  document.getElementById('ing-search').value = '';
  document.getElementById('ing-qty').value    = '';
  document.getElementById('selected-food-hint').style.display = 'none';
  document.getElementById('ing-add-btn').disabled = true;
  updateIngredientsList();
  updateRecipeSaveBtn();
}

function removeIngredient(idx) {
  currentIngredients.splice(idx, 1);
  updateIngredientsList();
  updateRecipeSaveBtn();
}

function updateIngredientsList() {
  const wrap = document.getElementById('recipe-ingredients-list');
  const itemsEl = document.getElementById('recipe-ingredients-items');
  document.getElementById('ing-count').textContent = currentIngredients.length;

  if (!currentIngredients.length) {
    wrap.style.display = 'none';
    return;
  }
  wrap.style.display = 'block';
  itemsEl.innerHTML = currentIngredients.map((ing, i) => `
    <div class="ingredient-row">
      <span>${ing.food.name} — ${ing.quantity}${esc(ing.unit)}</span>
      <button class="btn btn-red" style="padding:5px 9px" onclick="removeIngredient(${i})">
        <i data-lucide="x" style="width:13px;height:13px"></i>
      </button>
    </div>`).join('');
  lucide.createIcons();
}

function updateRecipeSaveBtn() {
  const name = document.getElementById('rf-name').value.trim();
  document.getElementById('recipe-save-btn').disabled = !name || !currentIngredients.length;
}

document.getElementById('rf-name').addEventListener('input', updateRecipeSaveBtn);

function calcNutrition(ingredients) {
  const t = { calories:0, protein:0, carbohydrates:0, fat:0, fiber:0, sugar:0, sodium:0 };
  ingredients.forEach(ing => {
    const r = ing.quantity / ing.food.serving_size;
    Object.keys(t).forEach(k => t[k] += ing.food[k] * r);
  });
  return Object.fromEntries(Object.entries(t).map(([k,v]) => [k, Math.round(v * 10) / 10]));
}

async function saveRecipe() {
  const name     = document.getElementById('rf-name').value.trim();
  const servings = parseInt(document.getElementById('rf-servings').value) || 1;
  if (!name || !currentIngredients.length) return;

  const nutrition = calcNutrition(currentIngredients);
  const recipe = {
    name,
    description: document.getElementById('rf-description').value.trim(),
    total_servings: servings,
    ...nutrition
  };

  try {
    let recipeId;

    if (editingRecipe) {
      const { error } = await db.from('recipes').update(recipe).eq('id', editingRecipe.id);
      if (error) throw error;
      await db.from('recipe_ingredients').delete().eq('recipe_id', editingRecipe.id);
      recipeId = editingRecipe.id;
    } else {
      const { data, error } = await db.from('recipes').insert([recipe]).select();
      if (error) throw error;
      recipeId = data[0].id;
    }

    const ings = currentIngredients.map(ing => ({
      recipe_id: recipeId,
      food_id:   ing.food.id,
      quantity:  ing.quantity,
      unit:      ing.unit
    }));
    const { error: ingErr } = await db.from('recipe_ingredients').insert(ings);
    if (ingErr) throw ingErr;

    await loadRecipes();
    cancelRecipeForm();
  } catch (err) {
    alert('Error saving recipe: ' + err.message);
  }
}

async function deleteRecipe(id) {
  if (!confirm('Delete this recipe?')) return;
  const { error } = await db.from('recipes').delete().eq('id', id);
  if (error) return alert('Error: ' + error.message);
  recipes = recipes.filter(r => r.id !== id);
  renderRecipes();
  updateStats();
}

async function duplicateRecipe(recipe) {
  const nutrition = calcNutrition(recipe.ingredients);
  const dup = {
    name: recipe.name + ' (Copy)',
    description: recipe.description,
    total_servings: recipe.total_servings,
    ...nutrition
  };

  try {
    const { data, error } = await db.from('recipes').insert([dup]).select();
    if (error) throw error;
    const newId = data[0].id;
    const ings = recipe.ingredients.map(ing => ({
      recipe_id: newId, food_id: ing.food.id, quantity: ing.quantity, unit: ing.unit
    }));
    await db.from('recipe_ingredients').insert(ings);
    await loadRecipes();
  } catch (err) {
    alert('Error duplicating: ' + err.message);
  }
}

// ─────────────────────────────────────────────
// RENDER RECIPES
// ─────────────────────────────────────────────
function renderRecipes() {
  const query  = document.getElementById('recipe-search').value.toLowerCase().trim();
  const sortBy = document.getElementById('recipe-sort').value;
  const el     = document.getElementById('recipes-list');

  if (!recipes.length) {
    el.innerHTML = `<div class="empty-state">
      <div class="big">No recipes yet</div>
      <div class="small">Create your first recipe above</div>
    </div>`;
    return;
  }

  let list = query ? recipes.filter(r => r.name.toLowerCase().includes(query)) : recipes;

  list = [...list].sort((a, b) => {
    if (sortBy === 'calories') {
      return ((b.calories||0)/b.total_servings) - ((a.calories||0)/a.total_servings);
    }
    return a.name.localeCompare(b.name);
  });

  if (!list.length) {
    el.innerHTML = `<div class="empty-state">
      <div class="big">No recipes found matching "${query}"</div>
      <div class="small">Try a different search term</div>
    </div>`;
    return;
  }

  // If no search: compact list view
  if (!query) {
    el.innerHTML = `<div class="results-label">${list.length} recipe${list.length!==1?'s':''} — click to view details</div>`
      + list.map(r => `
      <div class="recipe-card list-item" onclick="document.getElementById('recipe-search').value='${esc(r.name)}';renderRecipes()">
        <div>
          <h3>${esc(r.name)}</h3>
          <div class="meta">${r.ingredients.length} ingredient${r.ingredients.length!==1?'s':''} · ${r.total_servings} serving${r.total_servings>1?'s':''}</div>
        </div>
        <div class="cal-badge amber">${Math.round((r.calories||0)/r.total_servings)} cal/serving</div>
      </div>`).join('');
    lucide.createIcons();
    return;
  }

  // Detail view
  el.innerHTML = `<div class="results-label">Showing ${list.length} result${list.length!==1?'s':''}</div>`
    + list.map(r => {
      const ps = Object.fromEntries(
        ['calories','protein','carbohydrates','fat','fiber','sugar','sodium']
          .map(k => [k, Math.round(((r[k]||0) / r.total_servings) * 10) / 10])
      );
      return `
      <div class="recipe-card">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;gap:12px;flex-wrap:wrap">
          <div>
            <h3 style="font-size:26px;font-weight:bold;color:#ffaa00;text-transform:uppercase;margin-bottom:6px">${esc(r.name)}</h3>
            ${r.description ? `<p style="color:#999;font-size:14px;margin-bottom:6px">${esc(r.description)}</p>` : ''}
            <p style="color:#666;font-size:14px">Makes ${r.total_servings} serving${r.total_servings>1?'s':''}</p>
          </div>
          <div style="display:flex;gap:9px;flex-wrap:wrap">
            <button class="btn btn-green" style="padding:9px 13px;font-size:12px" onclick="duplicateRecipe_${r.id}()">
              <i data-lucide="copy" style="width:13px;height:13px"></i> COPY
            </button>
            <button class="btn btn-amber" style="padding:9px 13px;font-size:12px" onclick="editRecipe_${r.id}()">
              <i data-lucide="edit-2" style="width:13px;height:13px"></i> EDIT
            </button>
            <button class="btn btn-red" style="padding:9px 13px;font-size:12px" onclick="deleteRecipe(${r.id})">
              <i data-lucide="trash-2" style="width:13px;height:13px"></i> DELETE
            </button>
          </div>
        </div>
        <div class="nutrition-panel">
          <div class="nutrition-panel-header">
            <h4>Nutrition Per Serving</h4>
            <div class="cal-badge amber">${ps.calories} CAL</div>
          </div>
          <div class="nutrient-grid">
            ${[['Protein',ps.protein,'g'],['Carbs',ps.carbohydrates,'g'],['Fat',ps.fat,'g'],
               ['Fiber',ps.fiber,'g'],['Sugar',ps.sugar,'g'],['Sodium',ps.sodium,'mg']]
              .map(([l,v,u])=>`<div class="nutrient-item"><div class="label">${l}</div><div class="value">${v}${u}</div></div>`).join('')}
          </div>
        </div>
        <div>
          <div style="font-size:13px;color:#999;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">Ingredients</div>
          <div class="ingredients-display">
            ${r.ingredients.map(ing => `
              <div class="ingredient-display-item">• ${ing.quantity}${esc(ing.unit)} ${esc(ing.food.name)}</div>`).join('')}
          </div>
        </div>
      </div>`;
    }).join('');

  // Attach per-recipe functions (avoids inline closure issues)
  list.forEach(r => {
    window[`duplicateRecipe_${r.id}`] = () => duplicateRecipe(r);
    window[`editRecipe_${r.id}`]      = () => { startEditRecipe(r); };
  });

  lucide.createIcons();
}

// ─────────────────────────────────────────────
// EXPORT / IMPORT
// ─────────────────────────────────────────────
function exportData() {
  const blob = new Blob([JSON.stringify({ foods, recipes, exportDate: new Date().toISOString(), version: '1.0' }, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = `nutrition-database-${new Date().toISOString().split('T')[0]}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.foods || !data.recipes) return alert('Invalid file format');
      foods   = data.foods;
      recipes = data.recipes;
      renderFoods();
      renderRecipes();
      updateStats();
    } catch { alert('Error reading file'); }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ─────────────────────────────────────────────
// UTILS
// ─────────────────────────────────────────────
function esc(str) {
  return String(str ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─────────────────────────────────────────────
// BOOT
// ─────────────────────────────────────────────
init();
</script>
</body>
</html>
